[package]
name = "salaryman"
version = "0.0.1"
edition = "2024"
authors = ["Ren Kararou <ren@kararou.space>"]
description = "A very simple service management framework"

[features]
default = ["models", "smd", "sm-cli"]
models = []
smd = [
	"dep:clap",
	"dep:rayon",
	"dep:toml",
	"models",
]
sm-cli = [
	"dep:clap",
	"dep:toml",
	"models",
]

[dependencies]
rayon = { version = "1.10.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
toml = { version = "0.8.22", optional = true }
uuid = { version = "1.17.0", features = ["v4", "serde"] }

[dependencies.clap]
version = "4.5.39"
features = [
	"derive",
]
optional = true

[[bin]]
name = "smd"
path = "src/server/main.rs"
test = false
bench = false
required-features = ["smd"]

[[bin]]
name = "sm"
path = "src/cli/main.rs"
test = false
bench = false
required-features = ["sm-cli"]

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

