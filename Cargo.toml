[package]
name = "salaryman"
version = "0.0.1"
edition = "2024"
authors = ["Ren Kararou <ren@kararou.space>"]
description = "A very simple service management framework"

[features]
default = ["smd"]
smd = ["dep:clap", "dep:toml"]

[dependencies]
clap = { version = "4.5.39", features = ["derive"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = ["full"] }
toml = { version = "0.8.22", optional = true }

[[bin]]
name = "smd"
path = "src/smd/main.rs"
test = false
bench = false
required-features = ["smd"]

[profile.release]
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1

